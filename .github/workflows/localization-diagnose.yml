name: Localization Repair

on:
  push:
    branches: [android-rebuild]
    paths:
      - '.github/workflows/localization-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-rebuild
      - name: Add missing German translations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/res/values-de/strings.xml')
          s = p.read_text()
          additions = {
              'nav_journal': 'Tagebuch',
              'widget_hr_steps_name': 'NOOP Herzfrequenz &amp; Schritte',
              'widget_hr_steps_description': 'Live-Herzfrequenz und heutige Schritte auf einen Blick.',
          }
          missing = [(k, v) for k, v in additions.items() if f'name="{k}"' not in s]
          if missing:
              block = ''.join(f'    <string name="{k}">{v}</string>\n' for k, v in missing)
              s = s.replace('</resources>', block + '</resources>')
              p.write_text(s)
          PY
          FILE='android/app/src/main/res/values-de/strings.xml'
          if ! git diff --quiet -- "$FILE"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$FILE"
            git commit -m 'Add missing German translations'
            git push origin HEAD:android-rebuild
          fi

      - name: Verify localization key parity
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path('android/app/src/main/res')
          en = {x.attrib['name']: (x.text or '') for x in ET.parse(base/'values/strings.xml').getroot().findall('string')}
          de = {x.attrib['name']: (x.text or '') for x in ET.parse(base/'values-de/strings.xml').getroot().findall('string')}
          missing = sorted(k for k in en if k != 'app_name' and k not in de)
          blank = sorted(k for k,v in de.items() if not v.strip())
          print('MISSING:', missing)
          print('BLANK:', blank)
          print('APP_NAME_IN_DE:', 'app_name' in de)
          if missing or blank or 'app_name' in de:
              raise SystemExit(1)
          PY
